name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    name: Changed C++ Formatting and CI Tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pinned Formatter
        run: python -m pip install clang-format==21.1.8
      - name: Check Changed C++ Formatting
        run: python tools/ci/CheckFormatting.py
      - name: Test CI Helpers
        run: python -m unittest discover -s tools/ci/tests -v
      - name: Check Patch Whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" HEAD --
          else
            git show --format= --check HEAD --
          fi

  workflow-lint:
    name: GitHub Actions Workflow Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install Pinned Actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
      - name: Validate Workflows and Embedded Shell Scripts
        run: actionlint -color

  host-discovery:
    name: .NET Host Discovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Native Host Pack Discovery
        run: cmake -DTEST_ROOT="${{ runner.temp }}/host-discovery" -P cmake/tests/DotnetHostTest.cmake

  managed-build:
    name: C# ScriptCore and Game Script Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build ScriptCore with Warnings as Errors
        run: >-
          dotnet build Engine/Scripting/Managed/LuxEngine.ScriptCore/LuxEngine.ScriptCore.csproj
          --configuration Release --output "$RUNNER_TEMP/script-core"
          --artifacts-path "$RUNNER_TEMP/script-core-artifacts" --warnaserror
          -p:RestoreConfigFile="$GITHUB_WORKSPACE/Engine/Scripting/Managed/NuGet.Config"
          -p:NuGetAudit=false
      - name: Build Consumer Scripts Against ScriptCore
        run: >-
          dotnet build Engine/Tests/Scripting/Scripts.csproj
          --configuration Release --output "$RUNNER_TEMP/game-scripts"
          --artifacts-path "$RUNNER_TEMP/game-script-artifacts" --warnaserror
          -p:LuxEngineScriptCore="$RUNNER_TEMP/script-core/LuxEngine.ScriptCore.dll"
          -p:RestoreConfigFile="$GITHUB_WORKSPACE/Engine/Scripting/Managed/NuGet.Config"
          -p:NuGetAudit=false

  packaging-safety:
    name: Windows Packaging Failure and Data Preservation Tests
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject Invalid Configurations and Debug CRT Packages
        run: ./tools/Tests/TestPackagingIntegrity.ps1
      - name: Preserve Existing User Data During SDK Relocation
        run: ./tools/Tests/TestSdkRelocationSafety.ps1
      - name: Require Forge and Managed Runtime Package Contents
        run: ./tools/Tests/TestWindowsRuntimePackaging.ps1
