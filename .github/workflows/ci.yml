name: LuxEngine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-and-test:
    name: Windows Build, Test & SDK Consumer
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      QT_QPA_PLATFORM: offscreen
      LUX_EDITOR_SOFTWARE_VIEWPORT: '1'
      SDL_AUDIO_DRIVER: dummy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # CMake consumes installed sources; dependency downloads belong to CI setup.
      - name: Prepare Pinned The Forge Source
        uses: actions/checkout@v4
        with:
          repository: ConfettiFX/The-Forge
          ref: cd5046893faba2dc7869243873bf01f02a6f0df9
          path: Engine/ThirdParty/TheForge
          sparse-checkout: Common_3
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore vcpkg Binary Cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: windows-2022-msvc-vcpkg-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: windows-2022-msvc-vcpkg-

      - name: Install Dependencies via vcpkg
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Path .vcpkg-cache -Force | Out-Null
          vcpkg install --triplet x64-windows --clean-after-build sdl3 stb libzip nlohmann-json

      - name: Save Installed vcpkg Packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Build and Install Box2D 2.4.1
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Path C:/LuxDeps/src -Force | Out-Null
          git clone --depth 1 -b v2.4.1 https://github.com/erincatto/box2d C:/LuxDeps/src/box2d
          cmake -S C:/LuxDeps/src/box2d -B C:/LuxDeps/build/box2d -G "Visual Studio 17 2022" -A x64 -DBOX2D_BUILD_UNIT_TESTS=OFF -DBOX2D_BUILD_TESTBED=OFF -DBOX2D_BUILD_DOCS=OFF -DCMAKE_INSTALL_PREFIX=C:/LuxDeps -DCMAKE_DEBUG_POSTFIX=d
          foreach ($configuration in @('Debug', 'Release')) {
            cmake --build C:/LuxDeps/build/box2d --config $configuration --parallel 2
            cmake --install C:/LuxDeps/build/box2d --config $configuration
          }

      - name: Configure Engine, Editor & Tests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:/vcpkg' }
          if (-not (Test-Path "$vcpkgRoot/scripts/buildsystems/vcpkg.cmake")) {
            throw "vcpkg toolchain not found at $vcpkgRoot"
          }
          if (-not (Test-Path "$env:QT_ROOT_DIR/lib/cmake/Qt6/Qt6Config.cmake")) {
            throw 'The installed Qt 6 CMake package is missing.'
          }
          "$env:QT_ROOT_DIR/bin" >> $env:GITHUB_PATH
          $prefixPath = "C:/LuxDeps;$env:QT_ROOT_DIR"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DLUX_BUILD_TESTS=ON -DLUX_BUILD_EDITOR=ON `
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows "-DCMAKE_PREFIX_PATH=$prefixPath" `
            2>&1 | Tee-Object "$env:RUNNER_TEMP/configure-windows.log"

      - name: Build and Test Debug
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build build --config Debug --parallel 2
          ctest --test-dir build -C Debug --no-tests=error --output-on-failure `
            -L headless -LE 'long|slow' --timeout 180 --parallel 2 `
            --output-junit "$env:RUNNER_TEMP/ctest-windows-debug.xml"

      - name: Build and Test Release
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build build --config Release --parallel 2
          ctest --test-dir build -C Release --no-tests=error --output-on-failure `
            -L headless -LE 'long|slow' --timeout 180 --parallel 2 `
            --output-junit "$env:RUNNER_TEMP/ctest-windows-release.xml"

      - name: Run Scene Fuzz Seed Corpus and Mutations
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & ./build/bin/Debug/LuxFuzzScene.exe
          & ./build/bin/Debug/LuxFuzzScene.exe --runs 10000

      - name: Verify Packaging Failure Contracts
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & pwsh -NoProfile -File tools/Tests/TestPackagingIntegrity.ps1 -BuildDir build
          & pwsh -NoProfile -File tools/Tests/TestSdkRelocationSafety.ps1
          & pwsh -NoProfile -File tools/Tests/TestWindowsRuntimePackaging.ps1

      - name: Package SDK and Verify Relocated Consumer
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & pwsh -NoProfile -File tools/PackageSdk.ps1 -BuildDir build -OutputDir dist
          & pwsh -NoProfile -File tools/VerifySdkRelocation.ps1 -BuildDir build

      - name: Package and Verify Standalone Editor
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & pwsh -NoProfile -File tools/PackageEditor.ps1 -BuildDir build -OutputDir dist
          & pwsh -NoProfile -File tools/VerifyEditorStandalone.ps1

      - name: Package and Verify Standalone Player
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & pwsh -NoProfile -File tools/PackageRuntime.ps1 -BuildDir build -OutputDir dist
          & pwsh -NoProfile -File tools/VerifyRuntimeStandalone.ps1

      - name: Upload Diagnostics and JUnit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics
          path: |
            ${{ runner.temp }}/configure-windows.log
            ${{ runner.temp }}/ctest-windows-*.xml
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/Testing/Temporary/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LuxEngine-Distributions
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
